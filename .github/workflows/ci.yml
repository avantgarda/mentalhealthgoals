name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy values for jobs that only load the Payload config; jobs that talk to
  # a database override DATABASE_URL to point at their service container.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
  PAYLOAD_SECRET: ci-secret
  NEXT_PUBLIC_SERVER_URL: http://localhost:3000
  PREVIEW_SECRET: ci-preview-secret
  CRON_SECRET: ci-cron-secret

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  types-drift:
    name: Generated types in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:types-drift

  int-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm payload migrate
      - run: pnpm test:int

  migration-parity:
    name: Migrations match config schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The service container is Postgres 17 and pg_dump refuses to dump a
      # server newer than itself, so the image's 16 client is not enough. The
      # pgdg repository is already configured on the runner, so this is one
      # package; the timeouts are there because apt on runners can hang
      # indefinitely and eat the job's own timeout.
      - name: Install the PostgreSQL 17 client
        run: |
          sudo timeout 180 apt-get update
          sudo timeout 180 apt-get install -y --no-install-recommends postgresql-client-17
      # pg_wrapper resolves pg_dump to the highest installed major, so this both
      # reports the versions and fails loudly if 17 did not actually land.
      - name: Check the client is 17
        run: |
          pg_dump --version
          psql --version
          pg_dump --version | grep -qE ' 17\.' || {
            echo "pg_dump is not 17 — it cannot dump the Postgres 17 service" >&2
            exit 1
          }
      - run: pnpm check:migrations
        env:
          MIGRATION_CHECK_BASE_URL: postgresql://postgres:postgres@localhost:5432

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same sequence Vercel runs via `pnpm build:deploy`
      - run: pnpm payload migrate
      - run: pnpm build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm payload migrate
      # pnpm seed runs tsx --env-file=.env; config comes from job env, but the
      # file must exist
      - run: touch .env
      - run: pnpm seed
        env:
          SEED_ADMIN_EMAIL: ci-admin@example.com
          SEED_ADMIN_PASSWORD: ci-only-password
      # No --with-deps: it apt-installs system libraries, and apt on runners
      # can hang indefinitely. The runner image already carries Chromium's
      # system dependencies (it ships with Chrome).
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
