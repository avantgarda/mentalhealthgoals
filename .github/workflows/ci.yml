name: CI

on:
  push:
    branches: [main]
  pull_request:
  # By hand — `gh workflow run ci.yml --ref main` — and from deploy-catch-up.yml,
  # which starts CI for a commit on main that never got a run. A green run on
  # main deploys production whichever way it was started: see the last job.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy values for jobs that only load the Payload config; jobs that talk to
  # a database override DATABASE_URL to point at their service container.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
  PAYLOAD_SECRET: ci-secret
  NEXT_PUBLIC_SERVER_URL: http://localhost:3000
  PREVIEW_SECRET: ci-preview-secret
  CRON_SECRET: ci-cron-secret

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  types-drift:
    name: Generated types in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:types-drift

  int-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm payload migrate
      - run: pnpm test:int

  migration-parity:
    name: Migrations match config schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The service container is Postgres 17 and pg_dump refuses to dump a
      # server newer than itself, so the image's 16 client is not enough.
      #
      # The runner's client is a pgdg build, but the pgdg apt source is not in
      # its sources list at runtime — only Ubuntu, Microsoft and Google are —
      # so the repository has to be added before the package can be found.
      # The timeouts are there because apt on runners can hang indefinitely and
      # eat the job's own timeout.
      - name: Install the PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --max-time 60 \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo timeout 180 apt-get update
          sudo timeout 180 apt-get install -y --no-install-recommends postgresql-client-17
          # Installing is not enough: the runner already carries a 16 binary
          # that wins on PATH, so psql resolved to 17 while pg_dump stayed on
          # 16. Put the 17 directory in front for every later step.
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      # Both tools, because they resolved to different majors when only the
      # package was installed. Cheap, and it has caught two separate mistakes.
      - name: Check the client is 17
        run: |
          pg_dump --version
          psql --version
          for tool in pg_dump psql; do
            "$tool" --version | grep -qE ' 17\.' || {
              echo "$tool is not 17 — it cannot work with the Postgres 17 service" >&2
              exit 1
            }
          done
      - run: pnpm check:migrations
        env:
          MIGRATION_CHECK_BASE_URL: postgresql://postgres:postgres@localhost:5432

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same sequence Vercel runs via `pnpm build:deploy`
      - run: pnpm payload migrate
      - run: pnpm build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm payload migrate
      # The suite brings its own content: invented people and institutions,
      # shaped to exercise every path the site renders. Config comes from the
      # job env, so the fixture reads .env.local only if it happens to exist.
      - run: pnpm fixture
      # No --with-deps: it apt-installs system libraries, and apt on runners
      # can hang indefinitely. The runner image already carries Chromium's
      # system dependencies (it ships with Chrome).
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Production deploys from here, once every job above has passed on `main` —
  # not straight off the push. Vercel's git integration and Actions both start
  # from the same webhook and neither waits for the other, so a merge used to
  # begin deploying while its own CI was still running, and the checks required
  # before merge cover the pull request's head, not the merge commit.
  # `vercel.json` therefore turns automatic deployment off for `main`, and this
  # job stands in for it. Every other branch still deploys a preview on push.
  #
  # It is a job of this run, not a separate workflow listening for CI to
  # complete, because GitHub never fans a run created with GITHUB_TOKEN out into
  # `workflow_run` events: on 2026-09-23 a CI run that deploy-catch-up.yml had
  # started went green and deployed nothing, while a run a person had started
  # deployed within a minute. A job in the same run has no such dependency —
  # a green run on `main` deploys whoever started it.
  #
  # Requires the VERCEL_DEPLOY_HOOK_URL repository secret — Vercel → Project →
  # Settings → Git → Deploy Hooks, pointed at `main`.
  deploy:
    name: Deploy to production
    needs: [lint, typecheck, types-drift, int-tests, migration-parity, build, e2e]
    # Only `main`, and only when everything passed: a failed or cancelled job
    # leaves production exactly where it was, which is the entire point.
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Trigger the Vercel production deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL secret is not configured — production will not deploy. Create a deploy hook in Vercel (Project → Settings → Git → Deploy Hooks) pointed at 'main', and add its URL as a repository secret."
            exit 1
          fi

          echo "CI passed for ${COMMIT}; asking Vercel to deploy main."
          status=$(curl -sS -o /tmp/hook-response.json -w '%{http_code}' -X POST "$DEPLOY_HOOK_URL")

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Vercel deploy hook returned HTTP ${status}."
            cat /tmp/hook-response.json || true
            exit 1
          fi

          echo "Vercel accepted the deployment request (HTTP ${status})."
          cat /tmp/hook-response.json || true
